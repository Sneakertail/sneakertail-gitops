apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sneakertail-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sneakertail/sneakertail-gitops.git
    targetRevision: main
    path: apps/prod/children
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
