apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: interaction-service-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sneakertail/sneakertail-charts.git
    targetRevision: dev
    path: charts/interaction-service
    helm:
      releaseName: interaction-service
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
