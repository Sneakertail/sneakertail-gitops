name: deploy-prod-template

on:
  workflow_call:
    # Inputs
    inputs:
      release_tag:
        required: true
        type: string
    # Secrets
    secrets:
      CHARTS_REPO_TOKEN:
        required: true
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false

# Shared environment
env:
  SERVICE_NAME: ${{ github.event.repository.name }}
  IMAGE_REPOSITORY: ghcr.io/sneakertail/${{ github.event.repository.name }}
  SOURCE_IMAGE_TAG: ${{ github.sha }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  CHART_VALUES_FILE: charts/${{ github.event.repository.name }}/values-prod.yaml

jobs:
  # --------------------------------------------------
  # Validate the manual release request
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      failure_reason: ${{ steps.outcome.outputs.failure_reason }}
    steps:
      - id: branch
        name: Validate release branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Production workflow must run from the main branch."
            exit 1
          fi

      - id: tag
        name: Validate release tag format
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v*.*.*"
            exit 1
          fi

      - id: outcome
        if: always()
        shell: bash
        run: |
          reason=""
          if [ "${{ steps.branch.outcome }}" = "failure" ]; then
            reason="[release-branch] production workflow must run from main."
          elif [ "${{ steps.tag.outcome }}" = "failure" ]; then
            reason="[release-tag] release tag must match v*.*.*"
          fi
          echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------
  # Retag the already-built main image and update prod values after approval
  deploy:
    runs-on: ubuntu-latest
    needs: validate-release
    if: needs.validate-release.result == 'success'
    environment: prod
    permissions:
      contents: read
      packages: write
    outputs:
      failure_reason: ${{ steps.outcome.outputs.failure_reason }}
    steps:
      # Registry login
      - id: login
        name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Promote SHA image to release tag
      - id: promote-image
        name: Promote SHA image to release tag
        shell: bash
        run: |
          docker pull "${IMAGE_REPOSITORY}:${SOURCE_IMAGE_TAG}"
          docker tag "${IMAGE_REPOSITORY}:${SOURCE_IMAGE_TAG}" "${IMAGE_REPOSITORY}:${RELEASE_TAG}"
          docker push "${IMAGE_REPOSITORY}:${RELEASE_TAG}"

      # Charts checkout
      - id: checkout-charts
        name: Checkout charts repository
        uses: actions/checkout@v4
        with:
          repository: Sneakertail/sneakertail-charts
          ref: main
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts-repo

      # Values update
      - id: update-values
        name: Update Helm values
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq -i '.image.tag = strenv(RELEASE_TAG)' "charts-repo/${CHART_VALUES_FILE}"

      # Commit and push
      - id: commit-values
        name: Commit updated Helm values
        shell: bash
        working-directory: charts-repo
        run: |
          git config user.name "sneakertail-ci"
          git config user.email "ci@sneakertail.local"
          if git diff --quiet -- "$CHART_VALUES_FILE"; then
            echo "No chart value changes to commit."
            exit 0
          fi
          git add "$CHART_VALUES_FILE"
          git commit -m "chore: promote $SERVICE_NAME to $RELEASE_TAG"
          git push origin HEAD:main

      - id: outcome
        if: always()
        shell: bash
        run: |
          reason=""
          if [ "${{ steps.login.outcome }}" = "failure" ]; then
            reason="[ghcr-login] GHCR login failed."
          elif [ "${{ steps.promote-image.outcome }}" = "failure" ]; then
            reason="[image-promote] failed to promote SHA image to release tag."
          elif [ "${{ steps.checkout-charts.outcome }}" = "failure" ]; then
            reason="[charts-checkout] checkout of sneakertail-charts failed."
          elif [ "${{ steps.update-values.outcome }}" = "failure" ]; then
            reason="[yq-update] updating the Helm values file failed."
          elif [ "${{ steps.commit-values.outcome }}" = "failure" ]; then
            reason="[charts-push] commit or push of the Helm values update failed."
          fi
          echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------
  # Send release notification
  notify:
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - deploy
    if: always()
    permissions:
      contents: read
    steps:
      - id: smtp-config
        name: Check SMTP configuration
        shell: bash
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_TO: ${{ vars.SMTP_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          missing=()
          [ -z "$SMTP_HOST" ] && missing+=("SMTP_HOST variable")
          [ -z "$SMTP_PORT" ] && missing+=("SMTP_PORT variable")
          [ -z "$SMTP_FROM" ] && missing+=("SMTP_FROM variable")
          [ -z "$SMTP_TO" ] && missing+=("SMTP_TO variable")
          [ -z "$SMTP_USERNAME" ] && missing+=("SMTP_USERNAME secret")
          [ -z "$SMTP_PASSWORD" ] && missing+=("SMTP_PASSWORD secret")
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'SMTP notification skipped. Missing:\n'
            printf ' - %s\n' "${missing[@]}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - id: compose
        if: steps.smtp-config.outputs.enabled == 'true'
        name: Build email content
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate-release.result }}
          VALIDATE_REASON: ${{ needs.validate-release.outputs.failure_reason }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_REASON: ${{ needs.deploy.outputs.failure_reason }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failures=()

          if [ "$VALIDATE_RESULT" = "failure" ]; then
            failures+=("${VALIDATE_REASON:-[release] validation failed.}")
          fi

          if [ "$DEPLOY_RESULT" = "failure" ]; then
            failures+=("${DEPLOY_REASON:-[deploy] job failed.}")
          elif [ "$DEPLOY_RESULT" = "skipped" ] && [ "$VALIDATE_RESULT" != "success" ]; then
            failures+=("[deploy] skipped because release validation failed.")
          fi

          if [ ${#failures[@]} -eq 0 ]; then
            subject="[Sneakertail][prod] SUCCESS - ${SERVICE_NAME} ${RELEASE_TAG}"
            {
              echo "body<<EOF"
              echo "Sneakertail production deployment succeeded for ${SERVICE_NAME}."
              echo
              echo "Environment: prod"
              echo "Source image: ${IMAGE_REPOSITORY}:${SOURCE_IMAGE_TAG}"
              echo "Release image: ${IMAGE_REPOSITORY}:${RELEASE_TAG}"
              echo "Values file updated: ${CHART_VALUES_FILE}"
              echo "Commit: ${GITHUB_SHA}"
              echo "Actor: ${GITHUB_ACTOR}"
              echo "Run: ${run_url}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            subject="[Sneakertail][prod] FAILURE - ${SERVICE_NAME} ${RELEASE_TAG}"
            {
              echo "body<<EOF"
              echo "Sneakertail production deployment failed for ${SERVICE_NAME}."
              echo
              echo "Environment: prod"
              echo "Commit: ${GITHUB_SHA}"
              echo "Actor: ${GITHUB_ACTOR}"
              echo "Run: ${run_url}"
              echo
              echo "Failure details:"
              for failure in "${failures[@]}"; do
                echo "- ${failure}"
              done
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "subject=${subject}" >> "$GITHUB_OUTPUT"

      - name: Send notification email
        if: steps.smtp-config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          secure: ${{ vars.SMTP_SECURE }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.compose.outputs.subject }}
          to: ${{ vars.SMTP_TO }}
          from: ${{ vars.SMTP_FROM }}
          body: ${{ steps.compose.outputs.body }}
